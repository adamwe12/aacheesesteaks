<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A&A Cheesesteak Co.</title>

<!-- FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Oswald:wght@400;600&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<!-- STRIPE -->
<script async src="https://js.stripe.com/v3/buy-button.js"></script>

<style>
body {
  margin: 0;
  background: linear-gradient(180deg, #3b1f1f, #5a1e1e);
  color: #fff;
  font-family: 'Montserrat', sans-serif;
}

header {
  text-align: center;
  padding: 40px 20px;
}

.logo {
  width: 300px;
}

.tagline-wrap {
  display: flex;
  justify-content: center;
  margin-top: 10px;
}

.tagline-text {
  fill: #f5d27a;
  stroke: #000;
  stroke-width: 1.5;
  font-size: 22px;
  font-family: 'Playfair Display', serif;
  letter-spacing: 2px;
}

section {
  max-width: 1100px;
  margin: auto;
  padding: 30px 20px;
}

.menu-img {
  width: 70%;
  display: block;
  margin: 0 auto 40px;
  border-radius: 12px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 25px;
}

.card {
  background: #2b1515;
  border-radius: 12px;
  padding: 18px;
  text-align: center;
  box-shadow: 0 0 15px rgba(0,0,0,0.6);
}

.card img {
  width: 100%;
  border-radius: 10px;
}

h2 {
  font-family: 'Oswald', sans-serif;
  margin: 10px 0;
}

.price {
  color: #f5d27a;
  font-size: 18px;
  margin: 8px 0;
}

stripe-buy-button {
  display: block;
  margin-top: 12px;
}

.maps {
  margin-top: 40px;
}

.map-title {
  text-align: center;
  font-family: 'Oswald', sans-serif;
  margin-bottom: 10px;
}

iframe {
  width: 100%;
  height: 250px;
  border: none;
  border-radius: 10px;
  margin-bottom: 20px;
}

footer {
  text-align: center;
  padding: 25px;
  background: #1a0d0d;
  color: #aaa;
}
</style>
</head>

<body>

<header>

  <img src="./assets/img/logo1.png" class="logo" alt="Logo">

  <div class="tagline-wrap">
    <svg width="500" height="120" viewBox="0 0 500 120">
      <path id="curve" d="M 50 100 Q 250 20 450 100" fill="transparent"/>
      
      <text class="tagline-text">
        <textPath href="#curve" startOffset="50%" text-anchor="middle">
          Real Deal Authentic • Philly Roots • No Shortcuts
        </textPath>
      </text>
    </svg>
  </div>

</header>

<section>

  <img src="./assets/img/menu1.png" class="menu-img" alt="Menu">

  <div class="grid">

    <div class="card">
      <img src="./assets/img/hoagie1.jpg">
      <h2>Standard Cheesesteak</h2>
      <div class="price">$12.99</div>
      <stripe-buy-button buy-button-id="buy_btn_1TJ9SkBMYjj5IrfpE83tPYpp"
      publishable-key="pk_live_51TJ5XjBMYjj5IrfpxbGWRDpTvnReZ1nRWkLaGFX7FxM78iIBgyx68fyYJTVkHohY1VelmnppNTk0X9oyPfrPuPCW003RmCjV4f"></stripe-buy-button>
    </div>

    <div class="card">
      <img src="./assets/img/hoagie2.jpg">
      <h2>Italian Style Cheesesteak</h2>
      <div class="price">$14.99</div>
      <stripe-buy-button buy-button-id="buy_btn_1TJA3aBMYjj5IrfpOqRtHByF"
      publishable-key="pk_live_51TJ5XjBMYjj5IrfpxbGWRDpTvnReZ1nRWkLaGFX7FxM78iIBgyx68fyYJTVkHohY1VelmnppNTk0X9oyPfrPuPCW003RmCjV4f"></stripe-buy-button>
    </div>

    <div class="card">
      <img src="./assets/img/hoagie3.jpg">
      <h2>Hoagie Style Cheesesteak</h2>
      <div class="price">$14.99</div>
      <stripe-buy-button buy-button-id="buy_btn_1TJADUBMYjj5IrfpBuTxysiw"
      publishable-key="pk_live_51TJ5XjBMYjj5IrfpxbGWRDpTvnReZ1nRWkLaGFX7FxM78iIBgyx68fyYJTVkHohY1VelmnppNTk0X9oyPfrPuPCW003RmCjV4f"></stripe-buy-button>
    </div>

    <div class="card">
      <img src="./assets/img/hoagie4.jpg">
      <h2>Steak Fries</h2>
      <div class="price">$4.99</div>
      <stripe-buy-button buy-button-id="buy_btn_1TJ9SkBMYjj5IrfpE83tPYpp"
      publishable-key="pk_live_51TJ5XjBMYjj5IrfpxbGWRDpTvnReZ1nRWkLaGFX7FxM78iIBgyx68fyYJTVkHohY1VelmnppNTk0X9oyPfrPuPCW003RmCjV4f"></stripe-buy-button>
    </div>

    <div class="card">
      <img src="./assets/img/hoagie5.jpg">
      <h2>Mac & Cheese</h2>
      <div class="price">$4.99</div>
      <stripe-buy-button buy-button-id="buy_btn_1TJ9SkBMYjj5IrfpE83tPYpp"
      publishable-key="pk_live_51TJ5XjBMYjj5IrfpxbGWRDpTvnReZ1nRWkLaGFX7FxM78iIBgyx68fyYJTVkHohY1VelmnppNTk0X9oyPfrPuPCW003RmCjV4f"></stripe-buy-button>
    </div>

  </div>

  <div class="maps">

    <div class="map-title">📍 Ogden, Utah</div>
    <iframe src="https://www.google.com/maps?q=Ogden,Utah&output=embed"></iframe>

    <div class="map-title">📍 Philadelphia, Pennsylvania</div>
    <iframe src="https://www.google.com/maps?q=Philadelphia,PA&output=embed"></iframe>

  </div>

</section>

<footer>
  © 2026 A&A Cheesesteak Co. • Built Different
</footer>

</body>
</html>
