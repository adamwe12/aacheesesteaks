<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A&A Cheesesteak Co.</title>

<!-- FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Cinzel:wght@500;700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">

<!-- STRIPE LOAD ONCE -->
<script async src="https://js.stripe.com/v3/buy-button.js"></script>

<style>

body {
  margin: 0;
  background: linear-gradient(180deg, #2b1414, #5a1e1e);
  color: #fff;
  font-family: 'Montserrat', sans-serif;
}

/* HEADER */
header {
  text-align: center;
  padding: 40px 20px 20px;
}

.logo {
  width: 240px;
}

/* TAGLINE (STRAIGHT + OUTLINE) */
.tagline {
  font-family: 'Cinzel', serif;
  font-size: 20px;
  color: #d4af37;
  margin-top: 15px;
  letter-spacing: 3px;
  text-align: center;

  text-shadow:
    -1px -1px 0 #000,
     1px -1px 0 #000,
    -1px  1px 0 #000,
     1px  1px 0 #000;
}

/* SECTION */
section {
  max-width: 1100px;
  margin: auto;
  padding: 30px 20px;
}

/* MENU IMAGE */
.menu-img {
  width: 60%;
  display: block;
  margin: 0 auto 50px;
  border-radius: 14px;
  box-shadow: 0 0 20px rgba(0,0,0,0.7);
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 30px;
}

/* CARD */
.card {
  background: #1f0f0f;
  border-radius: 14px;
  padding: 20px;
  text-align: center;
  box-shadow: 0 0 20px rgba(0,0,0,0.7);
  transition: transform 0.2s ease;
}

.card:hover {
  transform: scale(1.03);
}

.card img {
  width: 100%;
  border-radius: 10px;
}

h2 {
  font-family: 'Playfair Display', serif;
  margin: 12px 0;
}

.price {
  color: #d4af37;
  font-size: 18px;
  margin-bottom: 10px;
}

/* STRIPE BUTTON */
stripe-buy-button {
  display: block;
  margin-top: 12px;
}

/* MAPS */
.maps {
  margin-top: 50px;
}

.map-title {
  text-align: center;
  font-family: 'Cinzel', serif;
  margin: 15px 0;
  color: #d4af37;
}

iframe {
  width: 100%;
  height: 260px;
  border-radius: 12px;
  border: none;
  margin-bottom: 25px;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 25px;
  background: #140909;
  color: #aaa;
}

</style>
</head>

<body>

<header>

  <img src="./assets/img/logo1.png" class="logo" alt="Logo">

  <div class="tagline">
    AUTHENTIC PHILLY FLAVOR • NO SHORTCUTS • BUILT DIFFERENT
  </div>

</header>

<section>

  <!-- MENU IMAGE -->
  <img src="./assets/img/menu1.png" class="menu-img" alt="Menu">

  <div class="grid">

    <!-- STANDARD -->
    <div class="card">
      <img src="./assets/img/hoagie1.jpg" alt="">
      <h2>Standard Cheesesteak</h2>
      <div class="price">$12.99</div>

      <stripe-buy-button
        buy-button-id="buy_btn_1TJ9SkBMYjj5IrfpE83tPYpp"
        publishable-key="pk_live_51TJ5XjBMYjj5IrfpxbGWRDpTvnReZ1nRWkLaGFX7FxM78iIBgyx68fyYJTVkHohY1VelmnppNTk0X9oyPfrPuPCW003RmCjV4f">
      </stripe-buy-button>
    </div>

    <!-- ITALIAN -->
    <div class="card">
      <img src="./assets/img/hoagie2.jpg" alt="">
      <h2>Italian Cheesesteak</h2>
      <div class="price">$14.99</div>

      <stripe-buy-button
        buy-button-id="buy_btn_1TJA3aBMYjj5IrfpOqRtHByF"
        publishable-key="pk_live_51TJ5XjBMYjj5IrfpxbGWRDpTvnReZ1nRWkLaGFX7FxM78iIBgyx68fyYJTVkHohY1VelmnppNTk0X9oyPfrPuPCW003RmCjV4f">
      </stripe-buy-button>
    </div>

    <!-- HOAGIE -->
    <div class="card">
      <img src="./assets/img/hoagie3.jpg" alt="">
      <h2>Hoagie Style Cheesesteak</h2>
      <div class="price">$14.99</div>

      <stripe-buy-button
        buy-button-id="buy_btn_1TJADUBMYjj5IrfpBuTxysiw"
        publishable-key="pk_live_51TJ5XjBMYjj5IrfpxbGWRDpTvnReZ1nRWkLaGFX7FxM78iIBgyx68fyYJTVkHohY1VelmnppNTk0X9oyPfrPuPCW003RmCjV4f">
      </stripe-buy-button>
    </div>

    <!-- FRIES -->
    <div class="card">
      <img src="./assets/img/hoagie4.jpg" alt="">
      <h2>Steak Fries</h2>
      <div class="price">$4.99</div>

      <!-- reuse standard button if same Stripe product -->
      <stripe-buy-button
        buy-button-id="buy_btn_1TJ9SkBMYjj5IrfpE83tPYpp"
        publishable-key="pk_live_51TJ5XjBMYjj5IrfpxbGWRDpTvnReZ1nRWkLaGFX7FxM78iIBgyx68fyYJTVkHohY1VelmnppNTk0X9oyPfrPuPCW003RmCjV4f">
      </stripe-buy-button>
    </div>

    <!-- MAC -->
    <div class="card">
      <img src="./assets/img/hoagie5.jpg" alt="">
      <h2>Mac & Cheese</h2>
      <div class="price">$4.99</div>

      <stripe-buy-button
        buy-button-id="buy_btn_1TJ9SkBMYjj5IrfpE83tPYpp"
        publishable-key="pk_live_51TJ5XjBMYjj5IrfpxbGWRDpTvnReZ1nRWkLaGFX7FxM78iIBgyx68fyYJTVkHohY1VelmnppNTk0X9oyPfrPuPCW003RmCjV4f">
      </stripe-buy-button>
    </div>

  </div>

  <!-- MAPS -->
  <div class="maps">

    <div class="map-title">📍 Ogden, Utah</div>
    <iframe src="https://maps.google.com/maps?q=Ogden,Utah&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>

    <div class="map-title">📍 Philadelphia, Pennsylvania</div>
    <iframe src="https://maps.google.com/maps?q=Philadelphia,PA&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>

  </div>

</section>

<footer>
  © 2026 A&A Cheesesteak Co. • Authentic Philly Energy
</footer>

</body>
</html>
