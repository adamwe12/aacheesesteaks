body {
  margin: 0;
  background: linear-gradient(180deg, #2b1414, #5a1e1e);
  color: #fff;
  font-family: 'Montserrat', sans-serif;
}

/* HEADER */
header {
  text-align: center;
  padding: 40px 20px 20px;
}

.logo {
  width: 240px;
}

.tagline {
  font-family: 'Cinzel', serif;
  font-size: 20px;
  color: #d4af37;
  margin-top: 15px;
  letter-spacing: 3px;

  text-shadow:

    -1px  1px 0 #000,
     1px  1px 0 #000;
}

/* SECTION */
section {
  max-width: 1100px;
  margin: auto;
  padding: 30px 20px;
}

.menu-img {
  width: 65%;
  display: block;
  margin: 0 auto 50px;
  border-radius: 14px;
  box-shadow: 0 0 20px rgba(0,0,0,0.7);
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 30px;
}

  background: #1f0f0f;
  border-radius: 14px;
  padding: 20px;
  text-align: center;
  box-shadow: 0 0 20px rgba(0,0,0,0.7);
  transition: transform 0.2s ease;
}

.card:hover {
  transform: scale(1.03);
}

.card img {
  width: 100%;
  border-radius: 10px;
}

  font-family: 'Playfair Display', serif;
  margin: 12px 0;

}

.price {
  color: #d4af37;
  font-size: 18px;
  margin-bottom: 10px;
}

stripe-buy-button {
  margin-top: 10px;
  display: block;
}

  margin-top: 50px;

  color: #d4af37;
}
