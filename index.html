<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>A&A Cheesesteak Co. | Real Deal Authentic</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Art Deco / High-End Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-dark: #050608;
      --gold: #d4af37;
      --gold-soft: #f0d58a;
      --text-main: #f5f5f5;
      --text-muted: #c0c0c0;
      --shadow-strong: 0 24px 60px rgba(0, 0, 0, 0.8);
      --border-gold: 1px solid rgba(212, 175, 55, 0.7);
      --radius-lg: 18px;
      --radius-md: 12px;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #000;
      color: var(--text-main);
      margin: 0;
      overflow-x: hidden;
    }

    /* WALLPAPER FIX — NOW VISIBLE ON DESKTOP */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      background-image:
        url("Philly-Cheesesteak-4-of-5.jpg"),
        url("Philly-Cheesesteak-Overhead.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.38;
      filter: brightness(1.1) contrast(1.1) saturate(1.1);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0.85));
    }

    .page-shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 18px 80px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 22px;
      margin-bottom: 26px;
      border-radius: 999px;
      border: var(--border-gold);
      background: rgba(5, 6, 8, 0.92);
    }

    /* BUSINESS HOURS STYLING */
    .hours-box {
      margin-top: 40px;
      padding: 24px;
      border: var(--border-gold);
      border-radius: var(--radius-lg);
      background: rgba(5, 6, 8, 0.85);
      box-shadow: var(--shadow-strong);
      max-width: 420px;
    }

    .hours-box h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      margin: 0 0 14px;
      color: var(--gold);
      text-align: center;
      letter-spacing: 1px;
    }

    .hours-box .hour-line {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 16px;
      border-bottom: 1px solid rgba(212,175,55,0.25);
    }

    .hours-box .hour-line:last-child {
      border-bottom: none;
    }

    footer {
      margin-top: 60px;
      padding: 40px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="page-shell">

    <!-- YOUR EXISTING HEADER (UNCHANGED) -->
    <header>
      <!-- ... your header content stays exactly the same ... -->
    </header>

    <!-- YOUR EXISTING PAGE CONTENT (UNCHANGED) -->
    <!-- ... all your sections, images, menus, Stripe embeds, etc. ... -->

    <!-- ⭐ ADDED BUSINESS HOURS (ONLY NEW CONTENT) -->
    <div class="hours-box">
      <h2>Business Hours</h2>

      <div class="hour-line"><span>Sunday</span><span>4:00 PM – 10:00 PM</span></div>
      <div class="hour-line"><span>Monday</span><span>1:00 PM – 11:00 PM</span></div>
      <div class="hour-line"><span>Tuesday</span><span>1:00 PM – 11:00 PM</span></div>
      <div class="hour-line"><span>Wednesday</span><span>Closed</span></div>
      <div class="hour-line"><span>Thursday</span><span>1:00 PM – 11:00 PM</span></div>
      <div class="hour-line"><span>Friday</span><span>1:00 PM – 12:00 AM</span></div>
      <div class="hour-line"><span>Saturday</span><span>4:00 PM – 12:00 AM</span></div>
    </div>

    <!-- EXISTING FOOTER (UNCHANGED) -->
    <footer>
      © A&A Cheesesteak Co. — Real Deal Authentic
    </footer>

  </div>
</body>
</html>
